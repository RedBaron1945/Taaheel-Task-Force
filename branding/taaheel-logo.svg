<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" class="w-full h-full" style="display:block;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="40%" stop-color="#dfa135" />
      <stop offset="100%" stop-color="#b87b1c" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b3679" />
      <stop offset="100%" stop-color="#10214c" />
    </linearGradient>
    <linearGradient id="softBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#fcfbfa" />
      <stop offset="100%" stop-color="#f6f3ee" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <g filter="url(#badgeShadow)">
    <!-- Outer Shield / Circular Base -->
    <ellipse cx="120" cy="115" rx="88" ry="88" fill="url(#softBgGrad)" stroke="#1a3578" stroke-width="4.5" />
    <ellipse cx="120" cy="115" rx="81" ry="81" fill="none" stroke="#d5a036" stroke-width="1.8" stroke-dasharray="4 2" />

    <!-- Top Sunburst Rays (Golden Light of Knowledge) -->
    <g stroke="#d5a036" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
      <line x1="120" y1="92" x2="120" y2="46" />
      <line x1="112" y1="93" x2="98" y2="49" />
      <line x1="128" y1="93" x2="142" y2="49" />
      <line x1="105" y1="95" x2="78" y2="58" />
      <line x1="135" y1="95" x2="162" y2="58" />
      <line x1="99" y1="99" x2="62" y2="73" />
      <line x1="141" y1="99" x2="178" y2="73" />
      <line x1="95" y1="105" x2="52" y2="92" />
      <line x1="145" y1="105" x2="188" y2="92" />
    </g>

    <!-- Radiating Star Sparkles -->
    <circle cx="120" cy="40" r="1.8" fill="#d5a036" />
    <circle cx="94" cy="44" r="1.4" fill="#d5a036" />
    <circle cx="146" cy="44" r="1.4" fill="#d5a036" />
    <circle cx="72" cy="54" r="1.3" fill="#d5a036" />
    <circle cx="168" cy="54" r="1.3" fill="#d5a036" />

    <!-- Left & Right Laurel / Olive Knowledge Wreath (Navy) -->
    <!-- Left Branch -->
    <g fill="#1a3578">
      <path d="M58,110 C57,100 63,94 67,90 C66,96 64,103 62,110 Z" />
      <path d="M54,124 C52,114 59,108 64,105 C62,111 60,118 58,124 Z" />
      <path d="M53,138 C51,128 57,122 62,119 C61,125 58,132 57,138 Z" />
      <path d="M56,152 C54,142 60,136 66,134 C64,140 62,147 60,152 Z" />
      <path d="M64,164 C61,155 67,149 73,148 C71,154 69,160 68,164 Z" />
      <!-- Left Stems -->
      <path d="M60,98 Q52,130 68,165" fill="none" stroke="#1a3578" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Right Branch -->
    <g fill="#1a3578">
      <path d="M182,110 C183,100 177,94 173,90 C174,96 176,103 178,110 Z" />
      <path d="M186,124 C188,114 181,108 176,105 C178,111 180,118 182,124 Z" />
      <path d="M187,138 C189,128 183,122 178,119 C179,125 182,132 183,138 Z" />
      <path d="M184,152 C186,142 180,136 174,134 C176,140 178,147 180,152 Z" />
      <path d="M176,164 C179,155 173,149 167,148 C169,154 171,160 172,164 Z" />
      <!-- Right Stems -->
      <path d="M180,98 Q188,130 172,165" fill="none" stroke="#1a3578" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Stack of Books on Bottom Right -->
    <g transform="translate(142, 108)">
      <rect x="0" y="8" width="22" height="4" rx="1" fill="#1a3578" />
      <rect x="2" y="9" width="18" height="2" fill="#d5a036" />
      <rect x="-2" y="13" width="26" height="4.5" rx="1" fill="#1a3578" />
      <rect x="0" y="14.5" width="22" height="2" fill="#ffffff" />
      <rect x="-4" y="18.5" width="30" height="5" rx="1.2" fill="#1a3578" />
      <rect x="-2" y="20" width="26" height="2.2" fill="#d5a036" />
    </g>

    <!-- Open Book in Center -->
    <!-- Book Spine & Shadow -->
    <path d="M120,126 L120,105" stroke="#1a3578" stroke-width="3" stroke-linecap="round" />
    <!-- Left Open Page -->
    <path d="M120,105 C108,103 88,107 78,114 L78,127 C88,120 108,117 120,119 Z" fill="#ffffff" stroke="#1a3578" stroke-width="2" stroke-linejoin="round" />
    <path d="M120,109 C110,107 92,110 83,117" fill="none" stroke="#d5a036" stroke-width="1" />
    <path d="M120,113 C111,111 95,114 86,120" fill="none" stroke="#e2e8f0" stroke-width="0.9" />
    <!-- Right Open Page -->
    <path d="M120,105 C132,103 152,107 162,114 L162,127 C152,120 132,117 120,119 Z" fill="#ffffff" stroke="#1a3578" stroke-width="2" stroke-linejoin="round" />
    <path d="M120,109 C130,107 148,110 157,117" fill="none" stroke="#d5a036" stroke-width="1" />
    <path d="M120,113 C129,111 145,114 154,120" fill="none" stroke="#e2e8f0" stroke-width="0.9" />

    <!-- Golden Pen Nib (Symbol of Islamic Knowledge & Scribe) -->
    <g transform="translate(120, 84)">
      <!-- Pen Tip / Nib Body -->
      <path d="M0,-24 L7,-6 C8,-2 7,6 7,12 L-7,12 C-7,6 -8,-2 -7,-6 Z" fill="url(#goldGrad)" stroke="#1a3578" stroke-width="1.6" stroke-linejoin="round" />
      <!-- Nib Breather Hole & Slit -->
      <line x1="0" y1="-22" x2="0" y2="-4" stroke="#1a3578" stroke-width="1.3" />
      <circle cx="0" cy="-4" r="1.5" fill="#1a3578" />
      <!-- Nib Golden Engraving Line -->
      <path d="M-5,4 Q0,1 5,4" fill="none" stroke="#ffffff" stroke-width="1" />
    </g>

    <!-- Central Ribbon Banner (White with Navy Borders & Gold Accents) -->
    <!-- Ribbon Tail Left -->
    <path d="M34,168 L48,154 L48,172 L34,180 Z" fill="#0f2250" stroke="#1a3578" stroke-width="1.5" />
    <path d="M48,154 L58,162 L48,172 Z" fill="#15295c" />
    <!-- Ribbon Tail Right -->
    <path d="M206,168 L192,154 L192,172 L206,180 Z" fill="#0f2250" stroke="#1a3578" stroke-width="1.5" />
    <path d="M192,154 L182,162 L192,172 Z" fill="#15295c" />

    <!-- Main Curved Ribbon Body -->
    <path d="M42,162 C70,146 170,146 198,162 L194,182 C168,168 72,168 46,182 Z" fill="#ffffff" stroke="#1a3578" stroke-width="2.8" stroke-linejoin="round" />
    <!-- Golden Inner Trim on Ribbon -->
    <path d="M47,164 C73,150 167,150 193,164" fill="none" stroke="#d5a036" stroke-width="1.2" />
    <path d="M50,179 C74,167 166,167 190,179" fill="none" stroke="#d5a036" stroke-width="1.2" />

    <!-- Main Title Typography «مرحلة التأهيل» -->
    <text x="120" y="174" 
          font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, 'Noto Sans Arabic', 'Amiri', 'Traditional Arabic', sans-serif" 
          font-size="16" 
          font-weight="900" 
          fill="#13275c" 
          text-anchor="middle" 
          letter-spacing="0.4"
          style="font-feature-settings: 'cv01' on, 'ss01' on;">
      مرحلة التأهيل
    </text>

    <!-- Subtitle Motto Ribbon at Bottom -->
    <g transform="translate(120, 194)">
      <!-- Golden Diamond Accent -->
      <path d="M0,-8 L4,-4 L0,0 L-4,-4 Z" fill="#d5a036" />
      <text x="0" y="0" 
            font-family="system-ui, -apple-system, sans-serif" 
            font-size="7" 
            font-weight="700" 
            fill="#785312" 
            text-anchor="middle">
        على هدى .. وبصيرة أمة
      </text>
    </g>

    <!-- Bottom Gold Scroll Flourish -->
    <path d="M102,199 Q120,206 138,199 Q120,202 102,199" fill="#d5a036" stroke="#b87b1c" stroke-width="0.8" />
  </g>
</svg>